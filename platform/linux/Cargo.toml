[package]
name = "MindStudioInsight"
version = "0.1.0"
edition = "2021"
include = ["../resources"]

[[bin]]
name = "MindStudioInsight"
path = "../src/main.rs"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
strip = "symbols"

[dependencies]
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
wry024 = { package = "wry", registry = "crates-io", version="0.24.11", features = ["file-drop"], optional = true }

[features]
default = ["wry024"]
http = []

[package.metadata.bundle]
name = "MindStudioInsight"
identifier = "com.huawei.ascend.mindstudio"
version = "7.0.RC3"
short_description = "MindStudioInsight 7.0.RC3"
long_description = "Application: MindStudioInsight 7.0.RC3"
copyright = "Huawei Enterprise End User License Agreement."
icon = ["../resources/images/icons/mindstudio.ico"]
