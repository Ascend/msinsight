[package]
name = "MindStudioInsight"
version = "0.1.0"
edition = "2021"
include = ["resources"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
strip = "symbols"

[dependencies]

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = { registry = "crates-io", version="0.36", features = ["file-drop"], optional = true }
tao = { registry = "crates-io", version="0.35", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { registry = "crates-io", version="0.17.1", default-features = false, optional = true }

[features]
default = ["wry", "tao", "muda"]
http = []

[package.metadata.bundle]
name = "MindStudioInsight"
identifier = "com.huawei.ascend.mindstudio"
version = "7.0.RC3"
short_description = "MindStudioInsight 7.0.RC3"
long_description = "Application: MindStudioInsight 7.0.RC3"
copyright = "Huawei Enterprise End User License Agreement."
icon = ["resources/images/icons/mindstudio.ico"]
