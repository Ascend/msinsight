name: PreSmoke Job

on:
  workflow_call:
    inputs:
      REMOTE_URL:
        required: false
        type: string
        default: ${{ atomgit.repositoryurl }}
      pr_id:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.number }}
      IMAGE_FLAG:
        required: true
        type: string
      TARGET_BRANCH:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.base.ref }}
      runs_on_arch:
        required: true
        type: string
      ARTIFACT_NAME:
        required: true
        type: string

jobs:
  JOB_smoke:
    name: JOB_smoke
    # l0_ascend_msprof_communication 用例需要双卡 NPU，单卡 runner 上失败属环境限制，不阻断流水线
    continue-on-error: true
    env:
      ARTIFACT_NAME: ${{ format('{0}-{1}', inputs.ARTIFACT_NAME, atomgit.run_number) }}
    select: selected_by_default
    runs-on: [ self-hosted, default, x86, cpu=32 ]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/mindstudio-image/${{ inputs.IMAGE_FLAG }}
      options: --user root
    steps:
      - name: Download artifacts
        uses: download-artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts
      - name: PreSmoke
        run: |
          set -e
          export LC_ALL=C.UTF-8 && export LANG=C.UTF-8 && export LANGUAGE=C.UTF-8

          export PATH=/opt/rh/node/bin:$PATH
          export PATH=/root/.cargo/bin:$PATH

          REMOTE_URL=${{ inputs.REMOTE_URL }}
          TARGET_BRANCH=${{ inputs.TARGET_BRANCH }}
          WORKSPACE=${ATOMGIT_WORKSPACE}

          git clone -b ${TARGET_BRANCH} ${REMOTE_URL} ${WORKSPACE}/CODE
          cd ${WORKSPACE}/CODE

          # 代码检出
          git config --global user.email "AtlasAccount@noreply.gitcode.com"
          git config --global user.name "AtlasAccount"
          git fetch origin
          git fetch origin refs/merge-requests/${{ inputs.pr_id }}/head:new_${{ inputs.pr_id }}
          git checkout new_${{ inputs.pr_id }}
          git merge origin/${TARGET_BRANCH}
          git diff-tree -r --name-only --no-commit-id origin/${TARGET_BRANCH} HEAD > ../modify_files.txt
          cat ../modify_files.txt
          
          export CI=true
          cd ${WORKSPACE}/CODE/server/build
          python3 download_third_party.py
          python3 preprocess_third_party.py
          sed -i '37,40c\\unsigned minorVersion = std::stoi(std::string(userAgent.substr(posStart, posEnd - posStart)));' ${WORKSPACE}/CODE/server/third_party/uWebSockets/src/App.h
          sed -i '22d' ${WORKSPACE}/CODE/server/third_party/uWebSockets/src/App.h
          sed -i '21d' ${WORKSPACE}/CODE/server/third_party/mockcpp/CMakeLists.txt
          python3 build.py build
          cd ..

          ARCH=$(uname -m)
          export LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${WORKSPACE}/CODE/server/output/linux-${ARCH}/bin

          cd ../modules/build
          python3 build.py
          cd ../../e2e
          mkdir log
          npm ci
          npm run test:smoke
